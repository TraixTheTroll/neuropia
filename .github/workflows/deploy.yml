name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build production site
        run: npm run build
      - name: Check all public pages, local links and image references
        run: npm run check:site
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test the actual Neuropia site
        run: npm run test:site
      - name: Upload verified build for review
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: neuropia-verified-site
          path: _site/
          retention-days: 7
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neuropia-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
