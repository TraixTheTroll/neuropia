name: Sync ORCID publications

on:
  schedule:
    - cron: "23 5 * * *" # Daily at 05:23 UTC.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan and report without proposing bibliography changes
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/orcid-publications.yml"
      - "bin/sync_orcid_publications.py"
      - "test/test_orcid_publications.py"
      - "requirements-publications.txt"
      - "_data/publication_sync.yml"
      - "_data/members.yml"
      - "_bibliography/neuropia.bib"

permissions:
  contents: read

concurrency:
  group: orcid-publications-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-publications.txt
      - run: python -m pip install -r requirements-publications.txt
      - run: python -m unittest discover -s test -p 'test_orcid_publications.py' -v

  sync:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-publications.txt
      - run: python -m pip install -r requirements-publications.txt
      - name: Read public ORCID works and propose new articles
        id: scan
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          ORCID_ACCESS_TOKEN: ${{ secrets.ORCID_ACCESS_TOKEN }}
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python bin/sync_orcid_publications.py "${args[@]}" --report "$RUNNER_TEMP/orcid-review.md"
          cat "$RUNNER_TEMP/orcid-review.md" >> "$GITHUB_STEP_SUMMARY"
      # Bot-created PRs do not trigger normal PR workflows with GITHUB_TOKEN.
      # Build the candidate here before opening/updating its review PR.
      - uses: ruby/setup-ruby@v1
        if: steps.scan.outputs.added != '0' && inputs.dry_run != true
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v7
        if: steps.scan.outputs.added != '0' && inputs.dry_run != true
        with:
          node-version: "20"
          cache: npm
      - name: Build candidate bibliography with Jekyll
        if: steps.scan.outputs.added != '0' && inputs.dry_run != true
        env:
          JEKYLL_ENV: production
        run: |
          npm ci
          sudo apt-get update && sudo apt-get install -y imagemagick
          python -m pip install nbconvert
          npx prettier sources/orcid-sync/imports.json --write
          npm run lint:prettier
          bundle exec jekyll build
      - name: Create or update the publication review PR
        if: inputs.dry_run != true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/orcid-publications
          base: main
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "content: propose new ORCID publications"
          title: "Publications: review new ORCID articles"
          body-path: ${{ runner.temp }}/orcid-review.md
          add-paths: |
            _bibliography/neuropia.bib
            sources/orcid-sync/imports.json
