# Neuropia site settings. Public pages use the custom neuropia layout.
title: Neuropia
first_name: Neuropia
middle_name:
last_name:
contact_note: "Bergen, Norway.

  "
description: "Neuropia studies mesenchymal stem cells and extracellular vesicles for
  multiple sclerosis and other neurodegenerative disorders in Bergen, Norway.

  "
footer_text: 'Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a>
  with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme. Hosted
  by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

  '
keywords: Neuropia, Neuro-SysMed, Haukeland University Hospital, University of Bergen,
  research group
lang: en
icon: neuropia-favicon.png
url: https://neuropia.no
baseurl: ""
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
  - _pages
keep_files:
  - CNAME
  - ".nojekyll"
theme: al_folio_core
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
sass:
  style: compressed
jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude:
    - robots.txt
terser:
  compress:
    drop_console: true
scholar:
  last_name:
    - Kvistad
    - Kråkenes
    - Ytterdal
    - Sandvik
    - Gremes
    - Grønås
  first_name: []
  style: apa
  locale: en
  source: "/_bibliography/"
  bibliography: neuropia.bib
  bibliography_template: bib
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:
exclude:
  - AGENTS.md
  - CLAUDE.md
  - docs
  - sources
  - bin
  - test
  - output
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - requirements-publications.txt
  - requirements.txt
  - purgecss.config.js
  - playwright-report
  - test-results
  - README.md
  - LICENSE
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - al-folio-upgrade-report.md
plugins:
  - al_folio_core
  - al_folio_upgrade
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-terser
